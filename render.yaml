# Blueprint: https://dashboard.render.com/blueprints
# API only — frontend is served from site-hub on Netlify at /wma/

services:
  - type: web
    name: wheremyapplication-api
    runtime: node
    plan: free
    rootDir: server
    # --include=dev so TypeScript + @types install (NODE_ENV=production would skip them)
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CHROME_EXTENSION_IDS
        sync: false
      - key: CORS_ALLOW_RENDER
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
